
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin QR Generator</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f3f4f6;
    color: #111827;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 16px 12px 30px;
}

h1 {
    text-align: center;
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 800;
}

.sub {
    text-align: center;
    margin-bottom: 16px;
    color: #6b7280;
    font-size: 13px;
}

.card {
    background: #fff;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 9px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

button {
    border: none;
    border-radius: 10px;
    background: #eef0f3;
    color: #111827;
    min-height: 44px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

button.active {
    background: #111827;
    color: #fff;
}

.rack-grid,
.level-grid,
.pos-grid {
    grid-template-columns: repeat(6, 1fr);
}

.section-title {
    margin-top: 16px;
}

.qr-card {
    text-align: center;
    padding-top: 18px;
    padding-bottom: 18px;
}

.qr-label {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 14px;
    word-break: break-all;
}

#qrcode {
    min-height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
}

#qrcode img,
#qrcode canvas {
    max-width: 100%;
}

.note {
    margin-top: 12px;
    color: #6b7280;
    font-size: 12px;
}

.manual-area {
    display: flex;
    justify-content: flex-end;
}

.manual-btn {
    min-height: 42px;
    padding: 8px 16px;
    border-radius: 22px;
    background: #fff;
    border: 1px solid #d1d5db;
    color: #374151;
    font-size: 14px;
}

.manual-box {
    display: none;
    margin-top: 10px;
    background: #fff;
    border-radius: 16px;
    padding: 13px;
    border: 1px solid #e5e7eb;
}

.manual-box.show {
    display: block;
}

.manual-input {
    width: 100%;
    height: 48px;
    padding: 0 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

.manual-input:focus {
    border-color: #111827;
}

@media (max-width: 420px) {
    .app {
        padding: 12px 9px 25px;
    }

    h1 {
        font-size: 23px;
    }

    .card {
        padding: 13px;
    }

    .grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .rack-grid,
    .level-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .pos-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    button {
        min-height: 42px;
        font-size: 14px;
    }

    .qr-label {
        font-size: 18px;
    }

    #qrcode img,
    #qrcode canvas {
        width: 230px !important;
        height: 230px !important;
    }
}

@media (max-width: 330px) {
    .rack-grid,
    .level-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>
<div class="app">

    <h1>Bin QR Generator</h1>
    <div class="sub">Fast phone-friendly location QR</div>

    <section class="card">
        <div class="title">Aisle</div>
        <div id="aisles" class="grid"></div>

        <div class="title section-title">Rack</div>
        <div id="racks" class="grid rack-grid"></div>

        <div class="title section-title">Level</div>
        <div id="levels" class="grid level-grid"></div>

        <div class="title section-title">Position</div>
        <div id="positions" class="grid pos-grid"></div>
    </section>

    <section class="card qr-card">
        <div id="qrLabel" class="qr-label">F0-A01-001-01-A</div>
        <div id="qrcode"></div>
        <div class="note">
            QR automatically updates when location changes.
        </div>
    </section>

    <div class="manual-area">
        <button id="manualToggle" class="manual-btn">
            ＋ Manual QR
        </button>
    </div>

    <div id="manualBox" class="manual-box">
        <input
            id="manualInput"
            class="manual-input"
            type="text"
            autocomplete="off"
            placeholder="Enter any text / QR value">
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // ALL AISLES
    const aisleNames = [
        ...Array.from({ length: 21 }, (_, i) =>
            "A" + String(i + 1).padStart(2, "0")
        ),
        "FV01",
        "CR01",
        "FR01"
    ];

    // SAME RACK, LEVEL AND POSITION RANGES FOR ALL AISLES
    const config = {};

    aisleNames.forEach(function (aisle) {
        config[aisle] = {
            r: 28,
            l: 11
        };
    });

    // CURRENT LOCATION
    let selected = {
        aisle: "A01",
        rack: "001",
        level: "01",
        pos: "A"
    };

    function $(id) {
        return document.getElementById(id);
    }

    // CREATE BUTTONS
    function makeButtons(containerId, items, key) {
        const container = $(containerId);
        container.innerHTML = "";

        items.forEach(function (value) {
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = value;

            if (selected[key] === value) {
                button.classList.add("active");
            }

            button.addEventListener("click", function () {
                selected[key] = value;

                if (key === "aisle") {
                    selected.rack = "001";
                    selected.level = "01";
                    selected.pos = "A";

                    renderRacks();
                    renderLevels();
                    renderPositions();
                }

                makeButtons(containerId, items, key);
                updateLocation();
            });

            container.appendChild(button);
        });
    }

    // AISLES
    function renderAisles() {
        makeButtons("aisles", aisleNames, "aisle");
    }

    // RACKS 001 TO 028
    function renderRacks() {
        const racks = Array.from(
            { length: config[selected.aisle].r },
            (_, i) => String(i + 1).padStart(3, "0")
        );

        makeButtons("racks", racks, "rack");
    }

    // LEVELS 01 TO 11
    function renderLevels() {
        const levels = Array.from(
            { length: config[selected.aisle].l },
            (_, i) => String(i + 1).padStart(2, "0")
        );

        makeButtons("levels", levels, "level");
    }

    // POSITIONS A TO F FOR EVERY AISLE
    function renderPositions() {
        const positions = ["A", "B", "C", "D", "E", "F"];
        makeButtons("positions", positions, "pos");
    }

    // GENERATE QR
    function generateQR(code) {
        code = String(code || "").trim();

        if (!code) return;

        $("qrLabel").textContent = code;
        $("qrcode").innerHTML = "";

        if (typeof QRCode === "undefined") {
            $("qrcode").textContent =
                "QR library could not load. Check your internet connection.";
            return;
        }

        new QRCode($("qrcode"), {
            text: code,
            width: 250,
            height: 250,
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    // LOCATION FORMAT: F0-A01-001-01-A
    function updateLocation() {
        const code =
            "F0-" +
            selected.aisle + "-" +
            selected.rack + "-" +
            selected.level + "-" +
            selected.pos;

        generateQR(code);
    }

    // MANUAL QR TOGGLE
    $("manualToggle").addEventListener("click", function () {
        const box = $("manualBox");
        box.classList.toggle("show");

        if (box.classList.contains("show")) {
            $("manualInput").focus();
        }
    });

    // MANUAL QR GENERATION
    $("manualInput").addEventListener("input", function () {
        const value = this.value.trim();

        if (value) {
            generateQR(value);
        } else {
            updateLocation();
        }
    });

    // INITIALIZE WEBSITE
    renderAisles();
    renderRacks();
    renderLevels();
    renderPositions();
    updateLocation();

});
</script>
</body>
</html>
