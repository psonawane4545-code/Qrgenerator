
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bin QR Generator</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f3f4f6;
    color: #111827;
    font-family: Arial, Helvetica, sans-serif;
}

.app {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
    padding: 16px 12px 30px;
}

h1 {
    text-align: center;
    margin: 0 0 4px;
    font-size: 26px;
    font-weight: 800;
}

.sub {
    text-align: center;
    margin-bottom: 16px;
    color: #6b7280;
    font-size: 13px;
}

.card {
    background: #fff;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.title {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 9px;
}

.section-title {
    margin-top: 16px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
}

.rack-grid,
.level-grid,
.pos-grid {
    grid-template-columns: repeat(6, 1fr);
}

button {
    border: none;
    border-radius: 10px;
    background: #eef0f3;
    color: #111827;
    min-height: 44px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

button:active {
    transform: scale(.96);
}

button.active {
    background: #111827;
    color: #fff;
}

.qr-card {
    text-align: center;
    padding-top: 18px;
    padding-bottom: 18px;
}

.qr-label {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 14px;
    overflow-wrap: anywhere;
}

#qrcode {
    min-height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
}

#qrcode img,
#qrcode canvas {
    max-width: 100%;
    height: auto;
}

.note {
    margin-top: 12px;
    color: #6b7280;
    font-size: 12px;
}

.manual-area {
    display: flex;
    justify-content: flex-end;
    margin-top: 2px;
}

.manual-btn {
    min-height: 42px;
    padding: 8px 16px;
    border-radius: 22px;
    background: #fff;
    border: 1px solid #d1d5db;
    color: #374151;
    font-size: 14px;
}

.manual-box {
    display: none;
    margin-top: 10px;
    background: #fff;
    border-radius: 16px;
    padding: 13px;
    border: 1px solid #e5e7eb;
}

.manual-box.show {
    display: block;
}

.manual-input {
    width: 100%;
    height: 48px;
    padding: 0 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
    color: #111827;
}

.manual-input:focus {
    border-color: #111827;
}

@media(max-width:420px) {
    .app {
        padding: 12px 9px 25px;
    }

    h1 {
        font-size: 23px;
    }

    .card {
        padding: 13px;
    }

    .grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .rack-grid,
    .level-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .pos-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    button {
        min-height: 42px;
        font-size: 14px;
    }

    .qr-label {
        font-size: 18px;
    }
}

@media(max-width:330px) {
    .rack-grid,
    .level-grid {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>
<div class="app">

    <h1>Bin QR Generator</h1>
    <div class="sub">Fast phone-friendly location QR</div>

    <section class="card">

        <div class="title">Aisle</div>
        <div id="aisles" class="grid"></div>

        <div class="title section-title">Rack</div>
        <div id="racks" class="grid rack-grid"></div>

        <div class="title section-title">Level</div>
        <div id="levels" class="grid level-grid"></div>

        <div class="title section-title">Position</div>
        <div id="positions" class="grid pos-grid"></div>

    </section>

    <section class="card qr-card">
        <div id="qrLabel" class="qr-label">F0-A1-001-01-A</div>
        <div id="qrcode"></div>
        <div class="note">
            QR automatically updates when location changes.
        </div>
    </section>

    <div class="manual-area">
        <button id="manualToggle" class="manual-btn">
            ＋ Manual QR
        </button>
    </div>

    <div id="manualBox" class="manual-box">
        <input
            id="manualInput"
            class="manual-input"
            type="text"
            autocomplete="off"
            placeholder="Enter any text / QR value">
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const aisles = Array.from(
        { length: 21 },
        (_, i) => "A" + (i + 1)
    );

    const racks = Array.from(
        { length: 28 },
        (_, i) => String(i + 1).padStart(3, "0")
    );

    const levels = Array.from(
        { length: 11 },
        (_, i) => String(i + 1).padStart(2, "0")
    );

    const positions = ["A", "B", "C", "D", "E", "F"];

    let selected = {
        aisle: "A1",
        rack: "001",
        level: "01",
        pos: "A"
    };

    let manualMode = false;

    const $ = id => document.getElementById(id);

    function makeButtons(containerId, items, key) {
        const container = $(containerId);
        container.innerHTML = "";

        items.forEach(value => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = value;

            if (selected[key] === value && !manualMode) {
                button.classList.add("active");
            }

            button.addEventListener("click", function() {
                selected[key] = value;
                manualMode = false;

                $("manualInput").value = "";

                renderAll();
                updateLocation();
            });

            container.appendChild(button);
        });
    }

    function renderAll() {
        makeButtons("aisles", aisles, "aisle");
        makeButtons("racks", racks, "rack");
        makeButtons("levels", levels, "level");
        makeButtons("positions", positions, "pos");
    }

    function generateQR(value) {
        value = String(value || "").trim();

        if (!value) return;

        $("qrLabel").textContent = value;
        $("qrcode").innerHTML = "";

        if (typeof QRCode === "undefined") {
            $("qrcode").textContent =
                "QR library could not load. Check your internet connection.";
            return;
        }

        new QRCode($("qrcode"), {
            text: value,
            width: 250,
            height: 250,
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function updateLocation() {
        const code =
            "F0-" +
            selected.aisle + "-" +
            selected.rack + "-" +
            selected.level + "-" +
            selected.pos;

        generateQR(code);
    }

    $("manualToggle").addEventListener("click", function() {
        $("manualBox").classList.toggle("show");

        if ($("manualBox").classList.contains("show")) {
            $("manualInput").focus();
        }
    });

    $("manualInput").addEventListener("input", function() {
        const value = this.value.trim();

        if (value) {
            manualMode = true;
            renderAll();
            generateQR(value);
        } else {
            manualMode = false;
            renderAll();
            updateLocation();
        }
    });

    $("manualInput").addEventListener("keydown", function(event) {
        if (event.key === "Enter" && this.value.trim()) {
            generateQR(this.value.trim());

            $("qrcode").scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }
    });

    renderAll();
    updateLocation();

});
</script>
</body>
</html>
